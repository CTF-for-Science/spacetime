# Same as companion_preprocess_no_skip.yaml (16 learned companion kernels, kernel_dim 64) but
# each kernel is repeated over n_heads = 4 heads instead of 8, so n_kernels * n_heads = 64
# matches embedding/repeat_w64.
method: companion
kwargs:
  model_dim: 64
  n_kernels: 16
  kernel_dim: 64
  kernel_repeat: 1
  n_heads: 4
  head_dim: 1
  kernel_weights: null
  kernel_init: normal
  kernel_train: true
  skip_connection: false
  norm_order: 1
