# mhd-2cyls: embedding width reduced from 128 to 64 to fit 48 GB GPU memory.
# (D=122400: ~2.04B -> ~1.03B parameters; measured peak ~21 GB of tensors at batch 1, lag 30-32.)
dataset:
  name: mhd-2cyls
  pair_id:
  - 1
  - 2
  - 3
  - 4
  - 5
model:
  dropout: 0.25
  horizon: 64
  kernel_dim: 32
  lag: 32
  lr: 0.001
  n_blocks: 5
  weight_decay: 0.0001
  batch_size: 1
  criterion_weights:
  - 1
  - 1
  - 1
  data_transform: mean
  decoder_config: decoder/default
  early_stopping_epochs: 10
  embedding_config: embedding/repeat_w64  # 2 heads x 32 kernels = 64 (default 4 x 32 = 128)
  encoder_config: encoder/default_no_skip_w64  # first block 64*D wide (default 128*D)
  features: M
  loss: informer_rmse
  max_epochs: 20
  mlp_n_layers: 1
  name: spacetime
  no_wandb: true
  norm_order: 1
  output_config: output/default
  seed: 0
  train_split: 0.8
  device: cuda:0
  val_metric: informer_rmse
